<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BigQuery JSON to Table</title>
<style>
  :root {
    --border: #e3e6ea;
    --head: #1f2937;
    --stripe: #f7f9fb;
    --hover: #eef4ff;
    --muted: #9ca3af;
    --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #111827;
    background: #fff;
  }
  h1 { font-size: 20px; margin: 0 0 16px; }
  textarea {
    width: 100%;
    min-height: 180px;
    padding: 10px;
    font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace;
    border: 1px solid var(--border);
    border-radius: 6px;
    resize: vertical;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .actions { display: flex; align-items: center; gap: 12px; margin: 12px 0 20px; }
  button {
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  .status { color: #6b7280; }
  .status.error { color: #b91c1c; }
  .table-wrap {
    overflow: auto;
    max-height: 70vh;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    font-variant-numeric: tabular-nums;
  }
  th, td {
    padding: 8px 12px;
    text-align: left;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
  }
  th {
    position: sticky;
    top: 0;
    background: var(--head);
    color: #fff;
    font-weight: 600;
  }
  tbody tr:nth-child(even) { background: var(--stripe); }
  tbody tr:hover { background: var(--hover); }
  .num { text-align: right; }
  td.null { color: var(--muted); }
</style>
</head>
<body>

<h1>BigQuery JSON to Table</h1>

<textarea id="input" spellcheck="false"
  placeholder='Paste a JSON array of rows here, e.g. [{"currency_code": "USD", "transactions_sum": "303.56"}]'></textarea>

<div class="actions">
  <button id="show">Show table</button>
  <span id="status" class="status">Tip: Cmd/Ctrl + Enter also works.</span>
</div>

<div id="output"></div>

<script>
const input = document.getElementById('input');
const output = document.getElementById('output');
const statusEl = document.getElementById('status');

const NUMBER_RE = /^-?\d+(\.\d+)?$/;

// "currency_code" -> "Currency Code"
function prettyHeader(key) {
  return key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

// "-57200.48" -> "-57,200.48" (keeps the original digits exactly, no rounding)
function groupDigits(s) {
  const m = s.match(/^(-?)(\d+)(.*)$/);
  return m[1] + m[2].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + m[3];
}

const isEmpty = v => v === null || v === undefined || v === '';

// A column is numeric if every non-empty value looks like a number
function isNumericColumn(rows, col) {
  const values = rows.map(r => r[col]).filter(v => !isEmpty(v));
  return values.length > 0 && values.every(v => NUMBER_RE.test(String(v)));
}

function makeCell(value, numeric) {
  const td = document.createElement('td');
  if (isEmpty(value)) {
    td.textContent = '—';
    td.className = 'null';
  } else {
    const s = String(value);
    td.textContent = NUMBER_RE.test(s) ? groupDigits(s) : s;
  }
  if (numeric) td.classList.add('num');
  return td;
}

function renderTable(rows) {
  // Union of keys, in order of first appearance
  const cols = [...new Set(rows.flatMap(r => Object.keys(r)))];
  const numeric = Object.fromEntries(cols.map(c => [c, isNumericColumn(rows, c)]));

  const table = document.createElement('table');

  const headRow = table.createTHead().insertRow();
  for (const c of cols) {
    const th = document.createElement('th');
    th.textContent = prettyHeader(c);
    if (numeric[c]) th.classList.add('num');
    headRow.appendChild(th);
  }

  const tbody = table.createTBody();
  for (const r of rows) {
    const tr = tbody.insertRow();
    for (const c of cols) tr.appendChild(makeCell(r[c], numeric[c]));
  }

  const wrap = document.createElement('div');
  wrap.className = 'table-wrap';
  wrap.appendChild(table);
  output.replaceChildren(wrap);
}

function showTable() {
  const text = input.value.trim();
  if (!text) {
    output.replaceChildren();
    setStatus('Paste some JSON first.', true);
    return;
  }

  let data;
  try {
    data = JSON.parse(text);
  } catch (e) {
    output.replaceChildren();
    setStatus('Invalid JSON: ' + e.message, true);
    return;
  }

  if (!Array.isArray(data)) data = [data];
  if (data.length === 0 || data.some(r => typeof r !== 'object' || r === null || Array.isArray(r))) {
    output.replaceChildren();
    setStatus('Expected a JSON array of objects (rows).', true);
    return;
  }

  renderTable(data);
  const colCount = new Set(data.flatMap(r => Object.keys(r))).size;
  setStatus(`${data.length} rows, ${colCount} columns`, false);
}

function setStatus(msg, isError) {
  statusEl.textContent = msg;
  statusEl.classList.toggle('error', isError);
}

document.getElementById('show').addEventListener('click', showTable);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) showTable();
});
</script>
</body>
</html>
